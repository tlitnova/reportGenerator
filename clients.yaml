# =============================================================================
# Client -> vendor ID mapping for the monthly report pipeline.
# One entry per client. `sources:` controls which collectors run and which
# report sections appear for that client — set to `false` (not just blank)
# for anything that doesn't apply, so a collector can skip cleanly instead
# of erroring or leaving a stray "not available" gap.
#
# Where to find each ID:
#   autotask.company_id       Autotask > CRM > Companies > open the company ->
#                              the ID is in the URL (?CompanyID=xxxxx).
#   ninjaone.organization_id  NinjaOne > Administration > Organizations, or
#                              GET /v2/organizations and match by name.
#   sophos.tenant_id          Sophos Central Partner dashboard > Customers ->
#                              open the tenant; also returned by the Partner
#                              API's tenant list. data_region_url comes back
#                              from that same call (varies by tenant's region).
#   sophos.has_xdr_or_mdr     Whether this client's Email Security includes
#                              an XDR or MDR add-on — determines whether the
#                              Email collector can use the Message History
#                              API or must fall back to the mailbox collector.
#                              Check Sophos Central > My Products for the
#                              client's licensed products.
#   datto_saas_protection.saas_customer_id
#                              Datto Partner Portal > SaaS Protection > open
#                              the organization; ID is in the URL, or returned
#                              by GET /v1/saas/domains.
#   datto_bcdr.device_serials Datto Partner Portal > BCDR Status; serial number
#                              is shown per device. A client can have more than
#                              one appliance — list all that belong to them.
#   addigy.policy_id           Addigy > Policies > select the client's policy
#                              (MSPs typically run one policy tree per client)
#                              -> ID is in the URL.
#   ninjaone_saas_backup.organization_id
#                              NinjaOne SaaS Backup (Dropsuite) Partner Portal
#                              > Organizations. Confirm exact API field name
#                              once you're in — docs are a partner-portal PDF.
#   ninjaone.detailed_patch_compliance
#                              Optional, default false. When true, the NinjaOne
#                              collector pulls full OS+3rd-party Installed/
#                              Approved/Pending/Failed patch detail (4 extra
#                              API calls per device) instead of the cheaper
#                              default (Installed/Failed only, from one
#                              endpoint). Turn on for clients who need that
#                              level of detail (e.g. a compliance cycle like
#                              CMMC) — leave off otherwise to keep larger
#                              clients' collector runs fast.
#   sentinelone.site_id        SentinelOne console > Settings > Sites -> click
#                              the client's site -> Site Info shows the Site
#                              ID. Or GET /web/api/v2.1/sites with an
#                              Account-scoped token returns every site's id
#                              and name in one call.
# =============================================================================

